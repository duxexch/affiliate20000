kind = "web"
previewPath = "/"
title = "Affiliate Marketing Site"
version = "1.0.0"
id = "artifacts/affiliate-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20035

[services.development]
run = "pnpm --filter @workspace/affiliate-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/affiliate-site", "run", "build" ]
publicDir = "artifacts/affiliate-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20035"
BASE_PATH = "/"
